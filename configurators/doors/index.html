<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Door configurator – Keystone Wood Specialties</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/order-basket.css?v=2026.10.29-order-feedback">
<style>
/* the door configurator, on the SQL catalog: Keystone's doors, their options, standard selections, rules and prices all
   come from the catalog; only the drawing library (profiles and swatches) is this folder's. A clean white page: the
   options down the left in their own sections (each with a sage heading), the door's drawing and its section on the right. */
:root {
  --bg: #FFFFFF; --panel: #FFFFFF; --ink: #1C2422; --muted: #5F6B66; --line: #E1E5E2; --field: #FFFFFF; --soft: #F4F6F4;
  --sage: #94A596; --sage-ink: #4E6153; --sage-tint: #EDF1ED;
  --accent: #4E6153; --accent-ink: #FFFFFF; --blue: #2F5D7C; --warn: #9A3B1E; --ok: #2E7D6B; --plan-bg: #FFFFFF;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif; font-size: 15px; line-height: 1.45;
  display: grid; grid-template-columns: minmax(340px, 460px) 1fr; }
@media (max-width: 860px) { body { grid-template-columns: 1fr; height: auto; } }
[hidden] { display: none !important; }
/* the options: a light grey column, each section a white card with a sage heading */
.panel { background: var(--soft); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0; padding: 22px 20px 48px; }
.stage { overflow-y: auto; min-height: 0; padding: 22px 26px 48px; background: var(--bg); display: flex; flex-direction: column; gap: 16px; }
header h1 { font-size: 1.55rem; line-height: 1.1; font-weight: 720; margin: 0; letter-spacing: -0.01em; }
header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
.staff { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #FBF1DA; color: var(--ink); font-size: .85rem; border: 1px solid #EAD39A; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 0 16px 16px; margin-top: 14px; box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
section h2 { margin: 0 -16px 14px; padding: 10px 16px; background: var(--sage-tint); border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0;
  color: var(--sage-ink); font-size: .76rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
section.needs { border-color: #E3B7A6; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .84rem; color: var(--muted); }
label.field.wide { grid-column: 1 / -1; }
input, select, textarea { font: inherit; font-size: .95rem; color: var(--ink); background: var(--field); border: 1px solid #CBD2CD; border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--sage); outline-offset: 1px; border-color: var(--sage-ink); }
input[type="checkbox"] { width: auto; } input[type="range"] { padding: 0; }
.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: .92rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 3px rgb(0 0 0 / .05); }
.card > h2, .stage h2 { color: var(--sage-ink); }
/* door styles */
.styletiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.styletile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px 7px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: inherit; font: inherit; cursor: pointer; }
.styletile:hover { border-color: var(--sage-ink); } .styletile.on { border-color: var(--sage-ink); box-shadow: 0 0 0 2px var(--sage-ink) inset; }
.styleicon { display: block; width: 100%; height: 86px; } .styleicon svg { width: 100%; height: 100%; }
.stylename { font-size: 12px; line-height: 1.25; text-align: center; overflow-wrap: anywhere; }
.stylegroup { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 6px; }
.stylefind { width: 100%; margin-bottom: 10px; }
/* the door and its edge section side by side; stacked when there isn't room */
.views { display: grid; grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr); gap: 14px; align-items: start; }
.views .section .drawing svg { max-width: 100%; height: auto; }
@media (max-width: 1100px) { .views { grid-template-columns: 1fr; } }
.drawing { display: flex; justify-content: center; align-items: center; min-height: 360px; }
.drawing svg { max-width: 100%; max-height: 62vh; height: auto; }
.drawing.clickable svg { cursor: pointer; }
/* the parts of the door, each linked to its options */
.parts-legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 0; }
.parts-legend span { font-size: 12px; color: var(--muted); margin-right: 2px; }
.parts-legend button { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; }
.parts-legend button:hover { border-color: var(--sage-ink); background: var(--sage-tint); }
.parts-legend button.default { border-style: dashed; }
.defaults-note { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--sage-tint); color: var(--sage-ink); font-size: .84rem; }
.price { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
.price .big { font-size: 1.9rem; font-weight: 720; }
.msg { color: var(--warn); font-size: .9rem; margin: 4px 0 0; }
.note { color: var(--muted); font-size: .84rem; margin: 6px 0 0; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .8rem; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); }
/* the order basket (shared/order-basket.css): a section like the others */
section.order-basket { padding: 0 16px 16px; margin-top: 14px; border: 1px solid var(--line); }
section.order-basket > h2 { margin: 0 -16px 14px; padding: 10px 16px; background: var(--sage-tint); border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0;
  color: var(--sage-ink); font-size: .76rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
/* the price and the parts: shown once there's something in them */
.card:has(> #price:empty), .card:has(> h2 + #parts:empty) { display: none; }
</style>
</head>
<body>
<aside class="panel" aria-label="Choose your door">
  <header><h1>Door configurator</h1><p>Keystone Wood Specialties</p><div class="staff" id="staffNote" hidden></div></header>
  <div id="controls"><p class="note">Loading…</p></div>
</aside>
<main class="stage">
  <div class="views"><div class="card" data-preview-surface><div class="drawing" id="drawing"><span class="empty">Loading…</span></div><div class="parts-legend" id="partsLegend" hidden></div><p class="defaults-note" id="defaultsNote" hidden></p><p class="note" id="drawNote"></p></div>
  <div class="card section" data-preview-surface><h2 style="margin:0 0 6px;font-size:1rem">Edge section</h2><div class="drawing" id="section" style="min-height:120px"></div><div id="sectionPics" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"></div><p class="note">The framing bead, lip/edge and panel, cut through the edge of the door.</p></div>
  </div>
  <div class="card"><div class="price" id="price"></div></div>
  <div class="card"><h2 style="margin:0 0 6px;font-size:1rem">Parts</h2><div id="parts"></div></div>
</main>
<script src="door-kit.js?v=2026.11.04-glaze"></script>
<script src="../../shared/sql-looks.js?v=2026.10.28-srp350"></script>
<script src="../../shared/sql-doors.js?v=2026.11.24-shown-in"></script>
<script src="../../shared/order-basket.js?v=2026.10.29-order-feedback"></script>
<script>
(() => {
  'use strict';
  // the door picker is shared with the kitchen planner (shared/sql-doors.js), so both offer exactly the same doors
  const $ = s => document.querySelector(s), esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const q = new URLSearchParams(location.search), staff = q.get('staff') === '1', money = v => Number(v).toLocaleString('en-US', { style: 'currency', currency: 'USD' }), frac = SqlDoors.frac;
  const missing = [['SqlDoors', 'shared/sql-doors.js'], ['SqlLooks', 'shared/sql-looks.js'], ['KeystoneDoors', 'configurators/doors/door-kit.js']].filter(([g]) => typeof window[g] === 'undefined').map(([, f]) => f);
  if (missing.length) { $('#controls').innerHTML = `<p class="msg">The door configurator is missing ${esc(missing.join(', '))}. Upload ${missing.length === 1 ? 'that file' : 'those files'} to the site and reload.</p>`; $('#drawing').innerHTML = ''; return; }
  const basket = KeystoneBasket.mount({ controls: $('#controls'), configurator: 'door', staff });
  if (staff) { $('#staffNote').hidden = false; $('#staffNote').textContent = 'Staff preview: doors as they’re set up in the admin, drafts included, whether or not they’re Live. Customers don’t see this page this way.'; }
  (async () => {
    const previewLoading = loading => {
      basket.loading(loading);
      SqlDoors.setPreviewLoading($('.views'), loading);
      if (!loading) return;
      $('#drawNote').textContent = loading.phase === 'price' ? 'Updating preview…' : `Loading ${loading.name}…`;
      $('#price').innerHTML = '<p class="note" role="status">Updating product choices and price…</p>';
      $('#parts').innerHTML = '';
    };
    previewLoading({ phase: 'catalog', name: 'styles' });
    const listReady = SqlDoors.loadList({ staff, configurator: 'door' });
    let E = null, lib = null;
    try { const Engine = await KeystoneDoors.loadEngine(); E = Engine.engine({}); lib = { FRAMES: window.KS_FRAMES, EDGES: window.KS_EDGES, PANELS: window.KS_PANELS, SPECIES: window.DC_SPECIES || [], FINISHES: window.DC_FINISHES || [] }; }
    catch (e) { drawingError = e.message; $('#drawing').innerHTML = `<span class="empty">The drawing library didn’t load (${esc(e.message)}); choices and prices still work.</span>`; }
    // the preview's parts, each linked to its options: the buttons under the drawing, and a click on the drawing itself
    // (near the outside: the edge; on the frame: the framing; inside: the panel; a slab: the wood)
    const PARTS = [['framing_bead', 'Framing'], ['panel_style', 'Panel'], ['lip', 'Edge'], ['wood', 'Wood'], ['finish', 'Finish']];
    let preview = null, dc = null;
    const legend = st => { const have = new Set((st.view.sections || []).flatMap(x => (x.items || []).map(i => i.key))), parts = PARTS.filter(([k]) => have.has(k));
      $('#partsLegend').hidden = !parts.length;
      $('#partsLegend').innerHTML = parts.length ? `<span>Change:</span>${parts.map(([k, l]) => `<button type="button" data-part="${k}" class="${(st.previewDefaults || []).includes(k) ? 'default' : ''}" title="${(st.previewDefaults || []).includes(k) ? 'Not chosen yet: shown with the display default' : ''}">${l}</button>`).join('')}` : ''; };
    $('#partsLegend').onclick = e => { const b = e.target.closest('[data-part]'); if (b && dc) dc.focus(b.dataset.part); };
    $('#drawing').onclick = e => {
      const svg = $('#drawing svg'); if (!preview || !dc || !E || !svg || !svg.getScreenCTM) return;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()), { w, h, job, kind } = preview;
      if (p.x < 0 || p.y < 0 || p.x > w || p.y > h) return;
      let key; if (Math.min(p.x, p.y, w - p.x, h - p.y) <= Math.min(0.5, Math.min(w, h) * 0.05)) key = 'lip';
      else if (job.type === 'slab') key = 'wood';
      else { let k = null; try { k = E.construct(kind, w, h, job); } catch { k = null; } const SL = k?.SL ?? 2.25, SR = k?.SR ?? 2.25, R = k?.R ?? 2.25, B = k?.B ?? 2.25;
        key = p.x < SL || p.x > w - SR || p.y < R || p.y > h - B ? 'framing_bead' : 'panel_style'; }
      if (!dc.focus(key)) dc.focus('wood');
    };
    dc = SqlDoors.create({ panel: $('#controls'), staff, listReady, onLoading: previewLoading, wanted: basket.wanted || q.get('product'), lib, onChange: st => {
      basket.change(st);
      if (!st.view) {
        preview = null; $('#drawing').classList.remove('clickable'); $('#partsLegend').hidden = true; $('#defaultsNote').hidden = true;
        $('#drawing').innerHTML = SqlDoors.previewPlaceholder(); $('#section').innerHTML = SqlDoors.previewPlaceholder(true);
        $('#drawNote').textContent = 'Choose a family, then a style, to begin.'; $('#sectionPics').innerHTML = ''; $('#price').innerHTML = ''; $('#parts').innerHTML = ''; return;
      }
      legend(st);
      if (st.pending?.length) {
        // choices still to make: the door drawn anyway, with Keystone's display defaults for what isn't chosen (shown as
        // defaults, not choices: they're not ordered or priced)
        const pw = SqlDoors.toIn(st.dims.width), ph = SqlDoors.toIn(st.dims.height), w = pw || 14, h = ph || 21, kind = /drawer/i.test(st.product.product_type || '') ? 'drawer' : 'door';
        preview = null;
        if (E && st.previewJob) {
          try { $('#drawing').innerHTML = E.elevation(kind, w, h, st.previewJob); preview = { kind, w, h, job: st.previewJob }; } catch (e) { $('#drawing').innerHTML = SqlDoors.previewPlaceholder(); }
          try { $('#section').innerHTML = E.section(st.previewJob); } catch { $('#section').innerHTML = SqlDoors.previewPlaceholder(true); }
        } else { $('#drawing').innerHTML = SqlDoors.previewPlaceholder(); $('#section').innerHTML = SqlDoors.previewPlaceholder(true); }
        $('#drawing').classList.toggle('clickable', !!preview); $('#drawing').title = preview ? 'Click a part of the door to change it' : '';
        const NAMES = { framing_bead: 'square framing bead', lip: 'square edge', panel_style: '¼" panel', wood: 'Paint Grade Superior Green', finish: 'no finish' };
        const shown = [...(!(pw && ph) ? ['14 × 21 in.'] : []), ...(st.previewDefaults || []).map(k => NAMES[k]).filter(Boolean)];
        $('#defaultsNote').hidden = !shown.length;
        $('#defaultsNote').textContent = shown.length ? `Shown with display defaults until you choose: ${shown.join(', ')}. These aren’t selections.` : '';
        $('#drawNote').textContent = 'Still to choose: ' + st.pending.join(', ') + '.'; $('#sectionPics').innerHTML = '';
        $('#price').innerHTML = '<p class="note" style="margin:0">The price shows once every choice is made.</p>'; $('#parts').innerHTML = ''; return;
      }
      $('#defaultsNote').hidden = true;
      if (st.price && st.price.drawError) $('#drawNote').textContent = `The drawing couldn’t be made: ${st.price.drawError}`;
      const r = st.price || {}, qty = Math.max(1, Math.round(Number(st.qty) || 1)), w = SqlDoors.toIn(st.dims.width) || 15.75, h = SqlDoors.toIn(st.dims.height) || 30.25;
      const kind = /drawer/i.test(st.product.product_type || '') ? 'drawer' : 'door';
      let drawingError = st.price?.drawError || '';
      preview = null;
      if (E && st.job) { try { $('#drawing').innerHTML = E.elevation(kind, w, h, st.job); preview = { kind, w, h, job: st.job }; } catch (e) { drawingError = e.message; $('#drawing').innerHTML = `<span class="empty">This door can’t be drawn yet (${esc(e.message)}).</span>`; }
        try { $('#section').innerHTML = E.section(st.job); } catch { $('#section').innerHTML = ''; }
        $('#sectionPics').innerHTML = (st.pictures || []).map(p => `<figure style="margin:0;display:flex;flex-direction:column;gap:4px;align-items:center"><img src="${esc(p.image)}" alt="${esc(p.name)} section" style="max-width:260px;max-height:200px;border:1px solid var(--line);border-radius:8px;background:#fff"><figcaption class="note" style="margin:0">${esc(p.name)}</figcaption></figure>`).join(''); }
      $('#drawing').classList.toggle('clickable', !!preview); $('#drawing').title = preview ? 'Click a part of the door to change it' : '';
      $('#drawNote').textContent = drawingError ? `Preview unavailable: ${drawingError}` : `Illustrative wood and finish; actual appearance varies. A drawing to show the style; the door is built to the parts list.${st.approx.length ? ` Drawn approximately: ${st.approx.join(', ')}.` : ''}${(st.unmatched || []).length ? ` Not shown as it really looks: ${st.unmatched.join(', ')}.` : ''}`;
      $('#price').innerHTML = !r.ok ? `<p class="msg">${esc(r.error || '')}</p>`
        : r.status === 'priced' ? `<div><div class="note" style="margin:0">Each</div><div class="big">${money(r.unit_price)}</div></div><div><div class="note" style="margin:0">${qty} × each</div><div class="big">${money(Number(r.unit_price) * qty)}</div></div>`
        : `<div><div class="big" style="font-size:1.2rem">${r.status === 'not_allowed' ? 'Can’t be made like this' : 'Not priced yet'}</div>${(r.messages || []).map(m => `<p class="msg">${esc(m)}</p>`).join('')}${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}</div>`;
      const ps = r.parts || [];
      $('#parts').innerHTML = ps.length ? `<table><thead><tr><th>Part</th><th class="n">Qty</th><th class="n">Width</th><th class="n">Length</th><th class="n">Thickness</th></tr></thead><tbody>${ps.map(p => `<tr><td>${esc(p.name && p.name !== p.alias ? p.name : String(p.alias).replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()))}</td><td class="n">${esc(p.qty ?? '')}</td><td class="n">${p.width != null ? frac(p.width) : '—'}</td><td class="n">${p.length != null ? frac(p.length) : '—'}</td><td class="n">${p.thickness != null ? frac(p.thickness) : '—'}</td></tr>`).join('')}</tbody></table>`
        : '<p class="empty">The parts list shows once the door can be worked out.</p>';
    } });
  })();
})();
</script>
</body>
</html>
